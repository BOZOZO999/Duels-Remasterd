<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duels (Remastered)</title><style>*{box-sizing:border-box}body{margin:0;background:#111525;color:white;font-family:system-ui,Arial;display:flex;align-items:center;justify-content:center;min-height:100vh}#wrap{position:relative;width:min(960px,100vw);aspect-ratio:16/10;box-shadow:0 15px 60px #0009;border:4px solid #30334b}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;background:#20243d}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#101527a8}#panel{background:#20213aeF;border:3px solid #e5bd75;border-radius:12px;padding:24px;min-width:min(360px,90%);max-width:85%;text-align:center;box-shadow:0 10px 40px #0009}h1{font-size:48px;color:#ffcc73;text-shadow:4px 4px #5d2e34;margin:0 0 12px}h2{margin:0 0 14px;color:#ffce84}.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.menu-grid button{margin:0;min-height:65px;font-size:16px;line-height:1.2}button{display:block;width:100%;padding:12px;margin:9px 0;background:#3a6599;border:2px solid #8fb9e5;border-radius:7px;color:white;font-size:18px;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#panel{max-height:92%;overflow-y:auto}button:hover{filter:brightness(1.25)}button.primary{background:#358747;border-color:#8ae59b}.classes{display:flex;gap:8px}.classes button{font-size:14px;padding:10px 4px}.selected{outline:3px solid #ffe486}.hint{color:#c7d2e4;font-size:14px;line-height:1.6}.hidden{display:none!important}#touch{position:absolute;bottom:8px;left:8px;right:8px;display:none;justify-content:space-between;pointer-events:none}#touch div{display:flex;gap:6px}#touch button{pointer-events:auto;width:54px;height:48px;margin:0;padding:2px;opacity:.75}@media(pointer:coarse){#touch{display:flex}}@media(max-width:600px){h1{font-size:32px}#panel{padding:12px}button{padding:8px;font-size:15px}.hint{font-size:12px}}</style></head><body><div id="wrap"><canvas id="game" width="960" height="600"></canvas><div id="overlay"><div id="panel"></div></div><div id="touch"><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button><button data-key="ArrowUp">⬆</button><button data-key="ArrowDown">⬇</button></div><div><button data-key="Shift">DASH</button><button data-key="z">Z ATK</button><button data-key="x">X SKILL</button></div></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel');ctx.imageSmoothingEnabled=false;
let multiplayerClass='Melee';let gameMode='duel',towerFloor=1,towerBest=1,towerRunKills=0;try{towerBest=Math.max(1,Number(localStorage.getItem('pixelDuelTowerBestV1'))||1)}catch(e){}let difficulty='Average';const difficultySettings={Noob:{reaction:34,move:1.8,attackChance:.35,chargeMin:15,chargeMax:35,jump:.025},Average:{reaction:18,move:3.1,attackChance:.75,chargeMin:30,chargeMax:65,jump:.09},Pro:{reaction:10,move:3.9,attackChance:.94,chargeMin:55,chargeMax:90,jump:.12},'HOLY CRAP BRO YOUR REALLY TRYING THIS':{reaction:5,move:4.5,attackChance:1,chargeMin:80,chargeMax:90,jump:.16}};let thunder=[],molotovs=[],firePatches=[];let state='menu',selected='Melee',player,enemy,projectiles=[],minions=[],particles=[],frame=0,last=0,gameResult='';const keys={};let platforms=[{x:95,y:416,w:225,h:14},{x:370,y:337,w:220,h:14},{x:640,y:416,w:225,h:14}];const names=['Melee','Archer','Necromancer','Stormcaller','Pyromancer','Guardian','Frost Mage','Engineer','Chronomancer'];const unlocks={Melee:0,Archer:0,Necromancer:0,Stormcaller:3,Pyromancer:7,Guardian:12,'Frost Mage':18,Engineer:26,Chronomancer:36};let kills=0;try{kills=Math.max(0,parseInt(localStorage.getItem('pixelDuelKillsV1')||'0',10)||0)}catch(e){}const colors={Melee:'#e9a049',Archer:'#62d783',Necromancer:'#ae75ec',Stormcaller:'#65c8c7',Pyromancer:'#ff7950',Guardian:'#8ba8d4','Frost Mage':'#91e8ff',Engineer:'#ffca67',Chronomancer:'#e2a6ff'};

const store=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}};

const shopClasses={'Frost Mage':180,Engineer:280,Chronomancer:400};let purchasedClasses=load('duelsPurchasedClassesV3',[]);let coins=load('duelsCoinsV2',0),owned=load('duelsSkinsV2',['Classic']),skin=load('duelsSkinSelectedV2','Classic'),arena='Castle',winsByClass=load('duelsClassWinsV2',{}),stats=load('duelsStatsV2',{duels:0,tower:0,dashes:0}),achieved=load('duelsAchievementsV2',[]),screenShake=0,damageNumbers=[],trainingDummy=null;
const arenas={Castle:{sky:['#252746','#9c5361'],floor:'#443c49',top:'#b68b59',platform:'#6d5868',layout:[[95,416,225],[370,337,220],[640,416,225]]},Forest:{sky:['#123b40','#8ab978'],floor:'#365443',top:'#8dc76a',platform:'#73583e',layout:[[85,413,210],[380,320,200],[665,413,210]]},Glacier:{sky:['#14375d','#83c7ee'],floor:'#376985',top:'#d2faff',platform:'#649ab9',layout:[[110,430,200],[375,320,210],[650,430,200]]},Volcano:{sky:['#331d31','#a74937'],floor:'#432d34',top:'#e97b43',platform:'#75505b',layout:[[95,418,210],[375,338,210],[655,418,210]]}};
const skins={Classic:{price:0,color:null},Emerald:{price:35,color:'#38ed9e'},Golden:{price:75,color:'#ffd15d'},Shadow:{price:120,color:'#7469c8'},Neon:{price:180,color:'#ff65d5'}};
const achievements=[['First Blood','Win your first fight',()=>kills>=1,15],['Ten Victories','Reach 10 wins',()=>kills>=10,30],['Veteran','Reach 25 wins',()=>kills>=25,60],['Tower Climber','Clear 5 Tower floors',()=>stats.tower>=5,45],['Dash Master','Dash 50 times',()=>stats.dashes>=50,30],['Class Collector','Unlock all 9 classes',()=>kills>=12&&Object.keys(shopClasses).every(n=>purchasedClasses.includes(n)),100]];
function checkAchievements(){let changed=false;for(const [name,,test,reward] of achievements){if(!achieved.includes(name)&&test()){achieved.push(name);coins+=reward;changed=true;for(let i=0;i<18;i++)particles.push({x:480,y:120,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*10,life:35,color:'#ffe38b'})}}if(changed){store('duelsAchievementsV2',achieved);store('duelsCoinsV2',coins)}}
function earnWin(){kills++;coins+=12;winsByClass[selected]=(winsByClass[selected]||0)+1;store('duelsCoinsV2',coins);store('duelsClassWinsV2',winsByClass);try{localStorage.setItem('pixelDuelKillsV1',String(kills))}catch(e){}checkAchievements()}
function randomArena(){const options=Object.keys(arenas);arena=options[Math.floor(Math.random()*options.length)];resetPlatforms()}
function shop(){state='shop';screen('Coin Shop • '+coins+' 🪙');const heading=document.createElement('h3');heading.textContent='Exclusive Classes';panel.appendChild(heading);for(const [name,price] of Object.entries(shopClasses)){const has=purchasedClasses.includes(name);const b=btn((has?'✓ ':'🔒 ')+name+' — '+(has?'Purchased':price+' coins'),()=>{if(has){selected=name;shop();return}if(coins<price)return;coins-=price;purchasedClasses.push(name);store('duelsPurchasedClassesV3',purchasedClasses);store('duelsCoinsV2',coins);selected=name;checkAchievements();shop()});if(!has&&coins<price)b.disabled=true;if(selected===name&&has)b.classList.add('selected')}const heading2=document.createElement('h3');heading2.textContent='Cosmetic Skins';panel.appendChild(heading2);const info=document.createElement('p');info.className='hint';info.textContent='Earn 12 coins per victory plus achievement bonuses. Shop-exclusive classes have unique abilities, not higher base stats. Skins are cosmetic.';panel.appendChild(info);for(const [name,entry] of Object.entries(skins)){const has=owned.includes(name),b=btn((skin===name?'✓ ':'')+name+' — '+(has?'Owned':entry.price+' coins'),()=>{if(!has){if(coins<entry.price)return;coins-=entry.price;owned.push(name);store('duelsCoinsV2',coins);store('duelsSkinsV2',owned)}skin=name;store('duelsSkinSelectedV2',skin);shop()});if(skin===name)b.classList.add('selected');if(!has&&coins<entry.price)b.disabled=true}btn('Back',menu)}
function achievementsMenu(){state='achievements';screen('Achievements');for(const [name,desc,,reward] of achievements){const p=document.createElement('p');p.className='hint';p.textContent=(achieved.includes(name)?'🏆 ':'🔒 ')+name+' — '+desc+' (+'+reward+' coins)';panel.appendChild(p)}btn('Back',menu)}
function training(){randomArena();gameMode='training';player=character(150,selected,false);enemy=character(750,'Guardian',true);enemy.ai=false;enemy.health=99999;enemy.max=99999;trainingDummy=enemy;projectiles=[];minions=[];particles=[];thunder=[];molotovs=[];firePatches=[];damageNumbers=[];frame=0;state='playing';overlay.classList.add('hidden');}
function resetPlatforms(){platforms=arenas[arena].layout.map(([x,y,w])=>({x,y,w,h:14}))}

function btn(label,fn,primary=false){const b=document.createElement('button');b.textContent=label;if(primary)b.className='primary';b.onclick=fn;panel.appendChild(b);return b}
function screen(title){overlay.classList.remove('hidden');panel.replaceChildren();const h=document.createElement(title==='DUELS (REMASTERED)'?'h1':'h2');h.textContent=title;panel.appendChild(h)}
function gameModes(){state='modes';screen('Game Modes');const p=document.createElement('p');p.className='hint';p.textContent='Choose how you want to play.';panel.appendChild(p);btn('⚔ Classic Duel',()=>start('duel'),true);btn('🏰 Tower Mode — Best Floor '+towerBest,()=>start('tower'));btn('🎯 Training Mode',training);btn('🌐 Online Multiplayer',partyHome);btn('Back',menu)}
let partyCode='',socket=null,onlineRole='',onlineConnected=false,onlineReady=false,remoteInputs={},remotePrevious={},netTick=0;
const networkKeys=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Shift','z','x'];
function sendNet(o){if(socket&&socket.readyState===1)socket.send(JSON.stringify(o))}
function partyHome(){state='party';screen('ONLINE PARTY');const p=document.createElement('p');p.className='hint';p.textContent='Play across two computers. Both players must open the hosted game at the same website address.';panel.appendChild(p);btn('Create Online Party',createParty,true);btn('Join Online Party',joinParty);btn('Same-Keyboard Multiplayer',multiplayerMenu);btn('Back',gameModes)}
function connectOnline(onOpen){if(socket)socket.close();socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');socket.onopen=onOpen;socket.onmessage=event=>{let m;try{m=JSON.parse(event.data)}catch(e){return}onlineMessage(m)};socket.onclose=()=>{if(onlineRole&&state!=='menu'&&state!=='modes'){onlineConnected=false;onlineReady=false;onlineError('Connection lost. Return to Game Modes and reconnect.')}};socket.onerror=()=>onlineError('Cannot connect. Run the online server and open its website URL.')}
function onlineError(msg){if(state==='playing'&&gameMode==='online'){state='end'}if(state==='party'||state==='party-join'||state==='online-lobby'||state==='end'){screen('ONLINE MULTIPLAYER');let p=document.createElement('p');p.className='hint';p.textContent=msg;panel.appendChild(p);btn('Back',gameModes)}}
function createParty(){onlineRole='host';state='online-lobby';screen('CONNECTING...');connectOnline(()=>sendNet({type:'create'}))}
function joinParty(){onlineRole='guest';state='party-join';screen('JOIN ONLINE PARTY');let p=document.createElement('p');p.className='hint';p.textContent='Enter the six-digit code from your friend.';panel.appendChild(p);let input=document.createElement('input');input.placeholder='6-digit code';input.maxLength=6;input.inputMode='numeric';input.style.cssText='padding:12px;font-size:20px;width:100%;text-align:center;color:#fff;background:#303955;border:1px solid #8fb9e5;border-radius:8px';panel.appendChild(input);btn('Connect',()=>{const code=input.value.trim();if(!/^\d{6}$/.test(code)){p.textContent='Please enter a valid 6-digit code.';return}partyCode=code;state='online-lobby';screen('CONNECTING...');connectOnline(()=>sendNet({type:'join',code}))},true);btn('Back',partyHome)}
function onlineLobby(){state='online-lobby';screen(onlineRole==='host'?'PARTY CREATED':'PARTY JOINED');let p=document.createElement('p');p.className='hint';p.textContent='Party code: '+partyCode+' • '+(onlineConnected?'Both players connected!':'Waiting for second player...');panel.appendChild(p);if(onlineRole==='host'&&onlineConnected){btn('Start Online Match',()=>{if(!classUnlocked(selected))selected='Melee';sendNet({type:'start',className:selected});},true)}if(onlineRole==='guest'){let label=document.createElement('p');label.className='hint';label.textContent='Select your class (unlocked classes only):';panel.appendChild(label);for(const name of names){if(classUnlocked(name))btn((multiplayerClass===name?'✓ ':'')+name,()=>{multiplayerClass=name;sendNet({type:'class',className:name});onlineLobby()})}btn('Ready — Waiting for Host',()=>{sendNet({type:'class',className:multiplayerClass});onlineLobby()},true)}btn('Leave Party',()=>{onlineRole='';if(socket)socket.close();gameModes()})}
function startOnlineHost(guestClass){randomArena();gameMode='online';player=character(180,selected,false);enemy=character(740,guestClass||'Melee',true);enemy.ai=false;enemy.face=-1;projectiles=[];minions=[];particles=[];damageNumbers=[];molotovs=[];firePatches=[];thunder=[];frame=0;remoteInputs={};remotePrevious={};state='playing';overlay.classList.add('hidden')}
function startOnlineGuest(){gameMode='online';player=character(180,'Melee',false);enemy=character(740,multiplayerClass,true);enemy.ai=false;projectiles=[];minions=[];particles=[];damageNumbers=[];molotovs=[];firePatches=[];thunder=[];state='playing';overlay.classList.add('hidden')}
function onlineMessage(m){if(m.type==='created'){partyCode=m.code;onlineLobby()}else if(m.type==='joined'){partyCode=m.code;onlineConnected=true;onlineLobby()}else if(m.type==='peer_joined'){onlineConnected=true;onlineLobby()}else if(m.type==='peer_left'){onlineConnected=false;onlineError('Your opponent disconnected.')}else if(m.type==='error'){onlineError(m.message)}else if(m.type==='class'&&onlineRole==='host'){multiplayerClass=names.includes(m.className)?m.className:'Melee'}else if(m.type==='start'){if(onlineRole==='host')startOnlineHost(multiplayerClass);else startOnlineGuest()}else if(m.type==='input'&&onlineRole==='host'){remoteInputs=m.keys||{}}else if(m.type==='snapshot'&&onlineRole==='guest'){if(state!=='playing')startOnlineGuest();arena=arenas[m.arena]?m.arena:'Castle';resetPlatforms();player=m.player;enemy=m.enemy;projectiles=m.projectiles||[];minions=m.minions||[];particles=m.particles||[];damageNumbers=m.damageNumbers||[];molotovs=m.molotovs||[];firePatches=m.firePatches||[];thunder=m.thunder||[];frame=m.frame||0;screenShake=0}else if(m.type==='result'){state='end';screen(m.winner===onlineRole?'YOU WIN!':'YOU LOSE!');btn('Return to Game Modes',gameModes,true)}}
function onlineEnd(win){state='end';sendNet({type:'result',winner:win?'host':'guest'});screen(win?'YOU WIN!':'YOU LOSE!');let p=document.createElement('p');p.className='hint';p.textContent='Online matches do not award coins or unlocks.';panel.appendChild(p);btn('Game Modes',gameModes,true)}
function onlineControlGuest(){const mapping={a:'ArrowLeft',d:'ArrowRight',w:'ArrowUp',s:'ArrowDown',f:'z',g:'x',h:'Shift'};for(const [local,remote] of Object.entries(mapping))keys[local]=!!remoteInputs[remote];const prev=remotePrevious;for(const [local,remote] of Object.entries(mapping)){if(prev[remote]&&!remoteInputs[remote]&&((local==='f'&&enemy.kind==='Archer')||(local==='g'&&enemy.kind==='Melee'))){if(local==='f')fireChargedArrow(enemy);else fireMeleeLunge(enemy)}}remotePrevious={...remoteInputs};controlPlayerTwo();for(const local of Object.keys(mapping))keys[local]=false}
function multiplayerMenu(){state='multiplayer-menu';screen('Local Multiplayer — 2 Players');const p=document.createElement('p');p.className='hint';p.textContent='Play against a friend on the same keyboard (not online). Player 1 uses arrows, Z, X, Shift. Player 2 uses A/D, W to jump, S to crouch, F for basic attack, G for special, H to dash. Choose Player 2 class:';panel.appendChild(p);const d=document.createElement('div');d.className='classes';d.style.flexWrap='wrap';panel.appendChild(d);for(const name of names){const b=document.createElement('button');b.textContent=name+(classUnlocked(name)?'':' 🔒');b.disabled=!classUnlocked(name);b.className=multiplayerClass===name?'selected':'';b.style.flex='1 1 29%';b.onclick=()=>{multiplayerClass=name;multiplayerMenu()};d.appendChild(b)}btn('Start Local Multiplayer',()=>{randomArena();gameMode='multiplayer';player=character(180,selected,false);enemy=character(740,multiplayerClass,true);enemy.ai=false;enemy.face=-1;projectiles=[];minions=[];particles=[];damageNumbers=[];molotovs=[];firePatches=[];thunder=[];frame=0;state='playing';overlay.classList.add('hidden')},true);btn('Back',gameModes)}
function multiplayerEnd(win){state='end';screen(win?'PLAYER 1 WINS!':'PLAYER 2 WINS!');const p=document.createElement('p');p.className='hint';p.textContent='Local multiplayer matches do not award coins or class unlocks.';panel.appendChild(p);btn('Rematch',multiplayerMenu,true);btn('Game Modes',gameModes);btn('Main Menu',menu)}
function controlPlayerTwo(){const o=enemy;const dir=o.crouching?0:(keys.d?1:0)-(keys.a?1:0);o.crouching=!!(keys.s&&o.ground&&!o.lungeFrames);if(keys.s&&o.platform>=0){o.dropThrough=13;o.y+=5;o.ground=false;o.crouching=false}if(o.crouching)o.vx=0;if(dir&&!o.lungeFrames&&!o.dashFrames){o.vx=dir*(o.kind==='Melee'?5.6:o.kind==='Archer'&&o.charging?2.1:o.kind==='Guardian'?3.65:4.8)*(o.slowTimer>0?.6:1);o.face=dir}if(keys.w&&o.ground&&!o.crouching&&!(o.kind==='Archer'&&o.charging)){o.vy=-13;o.ground=false}if(keys.h&&!o.dashPressed&&o.dashCooldown===0&&!o.crouching){o.dashPressed=true;o.dashFrames=10;o.dashCooldown=105}if(!keys.h)o.dashPressed=false;if(o.kind==='Archer'){if(keys.f&&o.atk===0){o.charging=true;o.charge=Math.min(90,o.charge+1)}if(keys.g&&!o.charging)attack(o,true)}else if(o.kind==='Melee'){if(keys.f&&!o.charging&&!o.lungeFrames)attack(o);if(keys.g&&o.skill===0&&!o.lungeFrames){o.charging=true;o.charge=Math.min(90,o.charge+1)}}else if(o.kind==='Pyromancer'){flameStep(o,!!keys.f);if(keys.g)attack(o,true)}else{if(keys.f)attack(o);if(keys.g)attack(o,true)}}
function menu(){state='menu';screen('DUELS (REMASTERED)');const p=document.createElement('p');p.className='hint';p.textContent='A pixel-art battle against a randomly chosen AI opponent! Total wins: '+kills+' • Arenas change randomly each match.';panel.appendChild(p);const grid=document.createElement('div');grid.className='menu-grid';panel.appendChild(grid);const entries=[['🎮 Game Modes',gameModes,true],['⚔ Classes',classes,false],['🪙 Shop: '+coins,shop,false],['🏆 Achievements',achievementsMenu,false],['⚙ Difficulty',difficulties,false],['📜 Instructions',instructions,false]];for(const [label,action,primary] of entries){const b=document.createElement('button');b.textContent=label;b.onclick=action;if(primary)b.className='primary';grid.appendChild(b)}}
function difficulties(){state='difficulty';screen('AI Difficulty');const info=document.createElement('p');info.className='hint';info.textContent='Only enemy AI behavior changes. Your stats stay the same.';panel.appendChild(info);Object.keys(difficultySettings).forEach(n=>{const b=btn(n,()=>{difficulty=n;difficulties()});if(n===difficulty)b.classList.add('selected')});btn('Back',menu)}
function classes(){state='classes';screen('Choose Your Class');const count=document.createElement('p');count.className='hint';count.textContent='AI defeats: '+kills+' • Win to unlock original classes; buy Frost Mage, Engineer, and Chronomancer in the Shop.';panel.appendChild(count);const d=document.createElement('div');d.className='classes';d.style.flexWrap='wrap';panel.appendChild(d);names.forEach(n=>{const b=document.createElement('button');const needed=unlocks[n];const exclusive=Object.hasOwn(shopClasses,n);const unlocked=exclusive?purchasedClasses.includes(n):kills>=needed;b.textContent=unlocked?n:'🔒 '+n+' ('+(exclusive?shopClasses[n]+' coins in Shop':needed+' wins')+')';b.style.flex='1 1 30%';b.className=n===selected?'selected':'';b.disabled=!unlocked;b.style.opacity=unlocked?'1':'.55';b.onclick=()=>{selected=n;classes()};d.appendChild(b)});const desc=document.createElement('p');desc.className='hint';const descriptions={Melee:'Z: sword slash. Hold X to charge a powerful forward lunge.',Archer:'Hold Z to charge an arrow. X fires a triple volley.',Necromancer:'Z launches dark magic. X summons a one-hit skeleton every 3 seconds.',Stormcaller:'Z: lightning bolt (8 damage). X: delayed thunder strike (18 damage).',Pyromancer:'Hold Z: flamethrower for up to 5 seconds, then 5 seconds to recharge. X: auto-aim a Molotov toward the enemy and leave burning ground.',Guardian:'Z: heavy hammer strike. X: raise a shield to block damage briefly.','Frost Mage':'Z: icy shard. X: slowing frost blast.','Engineer':'Z: rivet shot. X: deploy a temporary turret.','Chronomancer':'Z: time orb. X: slow the opponent briefly.'};desc.textContent=descriptions[selected];panel.appendChild(desc);btn('Game Modes',gameModes,true);btn('Shop',shop);btn('Back',menu)}
function instructions(){state='instructions';screen('How to Play');const p=document.createElement('p');p.className='hint';p.innerHTML='Online multiplayer: host uses arrows / Z / X / Shift; guest uses the same keys on their own computer.<br>Shift: Dash / dodge (cooldown)<br>LOCAL MULTIPLAYER: P1 = arrows, Z, X, Shift; P2 = A/D move, W jump, S crouch, F basic, G special, H dash.<br>ESC: Exit training<br>← / → : Move<br>↑ / Space : Jump<br>↓ : Crouch (duck under high attacks)<br>Z : Basic attack (Melee: slash; Archer: charge bow; Pyromancer: hold flamethrower)<br>X : Special attack (Melee: charge lunge; Pyromancer: Molotov)<br><br>Defeat the AI before your health reaches zero.<br>The AI randomly picks from all nine classes each match. Win to unlock Stormcaller (3), Pyromancer (7), and Guardian (12). Frost Mage, Engineer, and Chronomancer are shop-exclusive.<br>The difficulty button changes only Duel AI behavior. Arenas are randomized each match. Buy cosmetic skins, earn achievements, and practice in Training Mode. Tower Mode increases AI strength each floor.<br>AI Archers can charge their bows and AI fighters can crouch.<br>Jump up through floating platforms and land on top of them.<br>Press Down to drop through a platform.<br>Special attacks have cooldowns.<br><br>TOWER MODE: Defeat enemies floor by floor. Each floor has smarter, tougher AI. Heal 35 HP after each win. Your highest floor is saved.';panel.appendChild(p);const credit=document.createElement('p');credit.className='hint';credit.style.marginTop='18px';credit.style.fontWeight='bold';credit.textContent='Made by - Alex.R Colin.C and Lucas.S';panel.appendChild(credit);btn('Back',menu)}
function classUnlocked(name){return Object.hasOwn(shopClasses,name)?purchasedClasses.includes(name):kills>=unlocks[name]}
const bossTypes=[{name:'Iron Colossus',kind:'Guardian',color:'#ffb55e'},{name:'Storm Tyrant',kind:'Stormcaller',color:'#7cecff'},{name:'Bone Emperor',kind:'Necromancer',color:'#d4a1ff'},{name:'Inferno Lord',kind:'Pyromancer',color:'#ff6949'}];

firePatches=firePatches.filter(f=>f.life>0);for(const bolt of thunder){if(bolt.delay>0){bolt.delay--;if(bolt.delay===0){const t=bolt.owner===player?enemy:player;if(Math.abs(t.x+16-bolt.x)<32&&t.y+48>280){hit(t,bolt.damage,(t.x+16>bolt.x?1:-1)*3)}for(const m of minions){if(m.owner!==bolt.owner&&Math.abs(m.x+11-bolt.x)<26)m.life=0}}}else bolt.life--}thunder=thunder.filter(b=>b.life>0);

function draw(){ctx.save();if(screenShake>.2)ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);const a=arenas[arena];const sky=ctx.createLinearGradient(0,0,0,530);sky.addColorStop(0,a.sky[0]);sky.addColorStop(1,a.sky[1]);ctx.fillStyle=sky;ctx.fillRect(0,0,960,600);rect(0,365,960,150,'#b76d67');for(let i=0;i<12;i++){const x=i*92+25;rect(x,345+(i%4)*18,35,170,'#70465b');rect(x+9,318+(i%4)*18,16,35,'#70465b')}rect(0,528,960,72,a.floor);for(const p of platforms){rect(p.x+5,p.y+9,p.w-10,9,'#332e47');rect(p.x,p.y,p.w,p.h,a.platform);rect(p.x,p.y,p.w,5,'#e0b875');for(let tx=p.x+13;tx<p.x+p.w-5;tx+=30)rect(tx,p.y+7,17,3,'#8c7281')}rect(0,528,960,12,a.top);for(let i=0;i<30;i++){rect(i*36,542+(i%3)*18,23,6,'#5c4a50')}
if(state==='playing'||state==='end'){for(const m of minions){if(m.life<=0)continue;rect(m.x,495,22,32,m.turret?'#ffbc58':'#ded7c7');rect(m.x+4,500,4,5,'#3a3046');rect(m.x+14,500,4,5,'#3a3046')}for(const bolt of thunder){if(bolt.delay>0){rect(bolt.x-20,526,40,4,'#7cecff');rect(bolt.x-2,340,4,188,'#7cecff44')}else{rect(bolt.x-10,180,20,348,'#b4faff');rect(bolt.x-3,160,6,368,'#ffffff')}}for(const f of firePatches){for(let i=-2;i<=2;i++){const height=10+((frame+i*11)%18);rect(f.x+i*22-9,f.y-height,18,height,i%2?'#ff6b26':'#ffbc40')}}for(const m of molotovs){rect(m.x-5,m.y-8,10,15,'#a85e37');rect(m.x-2,m.y-12,4,6,'#ffda70')}for(const p of projectiles){rect(p.x-5,p.y-5,10,10,p.color)}for(const pyro of [player,enemy])if(pyro.kind==='Pyromancer'&&pyro.flameActive){for(let i=0;i<9;i++){const d=24+i*13;const jitter=Math.sin(frame*.5+i*2)*9;rect(pyro.x+16+pyro.face*d,pyro.y+16+jitter,12+Math.random()*8,8+i*.6,i%2?'#ffb334':'#ff5a28')}}sprite(player);sprite(enemy);if(enemy.boss){ctx.strokeStyle=enemy.boss.color;ctx.lineWidth=3;ctx.strokeRect(enemy.x-5,enemy.y-5,enemy.w+10,enemy.h+10);ctx.fillStyle=enemy.boss.color;ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText('★ BOSS ★',enemy.x+16,enemy.y-32);ctx.textAlign='left'}for(const pyro of [player,enemy])if(pyro.kind==='Pyromancer'){rect(pyro.x-8,pyro.y-24,48,8,'#251d32');rect(pyro.x-6,pyro.y-22,44*(pyro.flameRecharge>0?1-pyro.flameRecharge/300:pyro.flameFuel/300),4,pyro.flameRecharge>0?'#7dd7f7':'#ff9c45')}for(const archer of [player,enemy])if((archer.kind==='Archer'||archer.kind==='Melee')&&archer.charging){rect(archer.x-8,archer.y-22,48,9,'#211d32');rect(archer.x-6,archer.y-20,44*archer.charge/90,5,archer.charge>=90?'#7ffaff':'#f4e6a1');if(archer.charge>=90){ctx.fillStyle='#7ffaff';ctx.font='bold 12px monospace';ctx.fillText('MAX!',archer.x,archer.y-28)}}for(const p of particles)rect(p.x,p.y,5,5,p.color);for(const n of damageNumbers){ctx.font='bold 17px monospace';ctx.fillStyle='#ffe18d';ctx.fillText(n.text,n.x,n.y)}hud(player,32,25,'YOU • '+player.kind);hud(enemy,600,25,enemy.boss?'BOSS • '+enemy.boss.name:'AI • '+enemy.kind);ctx.fillStyle='#fff';ctx.font='bold 18px monospace';ctx.fillText(player.kind==='Archer'?'HOLD Z: CHARGE BOW   X: SPECIAL':player.kind==='Melee'?'Z: SLASH   HOLD X: CHARGE LUNGE':player.kind==='Pyromancer'?'HOLD Z: FLAME   X: MOLOTOV':player.kind==='Guardian'?'Z: HAMMER   X: SHIELD':'Z ATTACK   X SPECIAL',player.kind==='Archer'||player.kind==='Melee'?302:340,570);ctx.fillStyle='#e2c994';ctx.font='14px monospace';ctx.fillText(player.kind==='Pyromancer'?'Flame: '+(player.flameRecharge>0?'RECHARGING '+Math.ceil(player.flameRecharge/60)+'s':Math.ceil(player.flameFuel/60)+'s left')+'  Molotov: '+Math.ceil(player.skill/60)+'s':'Special cooldown: '+Math.ceil(player.skill/60)+'s',300,91);ctx.fillText(gameMode==='tower'?'TOWER FLOOR '+towerFloor+' • BEST '+towerBest:'AI: '+difficulty,32,112);ctx.fillText('WINS: '+kills+'  COINS: '+coins+'  ARENA: '+arena,32,135);ctx.fillText('DASH (SHIFT): '+(player.dashCooldown?Math.ceil(player.dashCooldown/60)+'s':'READY'),32,158);if(gameMode==='training'){ctx.fillStyle='#ffefb1';ctx.fillText('TRAINING DUMMY — PRESS ESC FOR MENU',290,165)}if(gameMode==='tower'){ctx.fillStyle='#fff1a5';ctx.font='bold 16px monospace';ctx.fillText('FLOOR '+towerFloor+(enemy.boss?' ★ BOSS FIGHT':'')+' / HP '+enemy.health+'/'+enemy.max,340,132)}}else{ctx.fillStyle='#ffe7b4';ctx.font='bold 25px monospace';ctx.textAlign='center';ctx.fillText('A FANTASY PIXEL ARENA',480,115);ctx.textAlign='left'}ctx.restore()}
function hud(o,x,y,label){ctx.font='bold 20px monospace';ctx.fillStyle='#fff';ctx.fillText(label,x,y);rect(x,y+12,325,23,'#352a39');rect(x+3,y+15,319*(o.health/o.max),17,o.ai?'#e65d68':'#61da80');ctx.font='bold 15px monospace';ctx.fillStyle='#fff';ctx.fillText(o.health+' / '+o.max,x+115,y+29)}
function loop(t){const dt=Math.min(50,t-last);last=t;if(!(gameMode==='online'&&onlineRole==='guest'&&state==='playing'))update();if(gameMode==='online'&&state==='playing'&&socket&&socket.readyState===1){if(onlineRole==='host'&&++netTick%2===0){sendNet({type:'snapshot',arena,frame,player,enemy,projectiles,minions,particles,damageNumbers,molotovs,firePatches,thunder})}else if(onlineRole==='guest'){let input={};for(const k of networkKeys)input[k]=!!keys[k];sendNet({type:'input',keys:input})}}draw();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Shift'].includes(e.key))e.preventDefault();if(e.key==='Escape'&&state==='playing'&&(gameMode==='training'||gameMode==='multiplayer')){menu();return}keys[e.key.length===1?e.key.toLowerCase():e.key]=true});document.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;if(k==='z'||k==='x'){if(!(gameMode==='online'&&onlineRole==='guest'))releaseBow(k)}if(gameMode==='multiplayer'&&enemy&&((k==='f'&&enemy.kind==='Archer')||(k==='g'&&enemy.kind==='Melee'))){if(k==='f')fireChargedArrow(enemy);else fireMeleeLunge(enemy)}});window.addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);if(player?.kind==='Melee')releaseBow('x');else releaseBow('z')});document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>{keys[k]=false;if(k==='z'||k==='x')releaseBow(k)});b.addEventListener('pointercancel',()=>{keys[k]=false;if(k==='z'||k==='x')releaseBow(k)})});resetPlatforms();menu();requestAnimationFrame(loop);
